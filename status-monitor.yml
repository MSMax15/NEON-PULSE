# Runs the status monitor with least-privilege permissions and pinned GitHub Actions.
name: status-monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      simulate:
        description: "Test status (simulation never sends a real email)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: status-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout source (no persisted credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Create status-data branch if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git ls-remote --exit-code --heads origin status-data >/dev/null 2>&1; then
            git checkout --orphan status-data
            git rm -rf . >/dev/null 2>&1 || true
            printf '%s\n' '{"status":"unlisted"}' > status.json
            git add status.json
            git -c user.name=neon-pulse-bot -c user.email=bot@users.noreply.github.com commit -m "init status data"
            AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" push origin status-data
            git checkout "$GITHUB_REF_NAME"
          fi

      - name: Checkout status data (no persisted credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: status-data
          path: data
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Check Rockstar status
        run: python monitor.py
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          SIMULATE: ${{ inputs.simulate }}

      - name: Save status (token available only during this step)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd data
          git config user.name neon-pulse-bot
          git config user.email bot@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "status update"
            AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" push origin HEAD:status-data
          fi
